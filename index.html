<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodingLab</title>
</head>
<style>
    .navbar
    {
        width: 100%;
        height: 60px;
        background-color: dimgray;
    }
    .navbar nav
    {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 100%;
        padding: 0 20px;
    }
    .navbar nav div h1
    {
        color: white;    
    }
    .navbar nav div a
    {
        margin:15px;
        text-decoration: none;
        color: white;
        font-weight: bold;
    }
    .contact
    {
        width: 100%;
        height: 700px;
        background-image: url(camera4.avif);
        background-repeat: no-repeat;
        background-size: cover;
    }
    .intro
    {
        width: 50%;
        height: 300px;
        color: white;
        margin: auto;
        padding: 20px;
        text-align: center;
        position: relative;
        top: 45%;
        transform: translateY(-50%);
    }
    .intro h1
    {
        font-size: 60px;
        line-height: 1.5;
    }
    .intro button
    {
        width: 150px;
        height: 40px;
        margin: 10px;
        border-radius: 5px;
        border: 1px solid white;
        background-color: transparent;
        color: white;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
    }
    .intro button:hover
    {
        background-color: white;
        color: black;
    }
</style>
<body>
    <div class="navbar">
        <nav>
            <div>
                <h1>CodingLab</h1>
            </div>
            <div>
                <a href="#">Home</a>
                <a href="#">About</a>
                <a href="#">Services</a>
                <a href="#">Contact</a>
                <a href="#">Feedback</a>
            </div>
        </nav>
    </div>

    <div class="contact">
        <div class="intro">
            <h1>
            Create Amazing Websites <br>
            Pure HTML & CSS only
            </h1>
            <button>Learn More</button>
            <button>Subscribe</button>
        </div>
    </div>

</body>
</html>
